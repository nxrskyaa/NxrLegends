<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes — Alpha Radar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128225;</text></svg>">
<style>
  :root{
    --bg:#07090d; --panel:#0d1117; --panel2:#111823; --line:#1e2836;
    --ink:#d6e2f0; --dim:#6d7d92; --accent:#38e1b0;
    --urgent:#ff4fb8; --alpha:#38e1b0; --signal:#4aa8ff; --watch:#ffc542; --noise:#4a5568;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.5}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  h1{margin:0;font-size:15px;letter-spacing:.22em;text-transform:uppercase}
  h1 span{color:var(--accent)}
  .meta{color:var(--dim);font-size:11px;display:flex;gap:14px;flex-wrap:wrap}
  .meta b{color:var(--ink);font-weight:500}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:6px;
    box-shadow:0 0 8px var(--accent);animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.3}}
  main{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(280px,1fr);gap:14px;padding:14px;align-items:start}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  section{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  h2{margin:0;padding:9px 14px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
     border-bottom:1px solid var(--line);background:var(--panel2)}
  .filters{display:flex;gap:6px;padding:9px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .filters button{font:inherit;font-size:10px;letter-spacing:.12em;background:transparent;color:var(--dim);
    border:1px solid var(--line);border-radius:3px;padding:4px 9px;cursor:pointer}
  .filters button[aria-pressed="true"]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
  .row{border-bottom:1px solid var(--line)}
  .row>summary{display:grid;grid-template-columns:64px 46px minmax(0,1fr) auto;gap:10px;align-items:center;
    padding:9px 14px;cursor:pointer;list-style:none}
  .row>summary::-webkit-details-marker{display:none}
  .row:hover{background:var(--panel2)}
  .tier{font-size:9px;letter-spacing:.12em;text-align:center;padding:3px 0;border-radius:3px;border:1px solid currentColor}
  .t-URGENT{color:var(--urgent)}.t-ALPHA{color:var(--alpha)}.t-SIGNAL{color:var(--signal)}
  .t-WATCH{color:var(--watch)}.t-NOISE{color:var(--noise)}
  .score{font-size:17px;text-align:right;font-variant-numeric:tabular-nums}
  .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nm small{color:var(--dim);margin-left:7px;font-size:11px}
  .stats{color:var(--dim);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .body{padding:4px 14px 14px 14px;background:var(--panel2);border-top:1px solid var(--line)}
  .sig{display:grid;grid-template-columns:110px 42px minmax(0,1fr);gap:10px;align-items:center;padding:3px 0;font-size:11px}
  .bar{height:7px;background:#182130;border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--signal),var(--accent))}
  .bar.nd{background:repeating-linear-gradient(90deg,#182130 0 4px,transparent 4px 8px)}
  .sig .lab{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sig .note{color:var(--dim);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .blockers{color:var(--urgent);font-size:11px;margin:8px 0 4px}
  .kv{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--dim);font-size:11px;margin-top:10px;
      padding-top:9px;border-top:1px solid var(--line)}
  .kv b{color:var(--ink);font-weight:500}
  a{color:var(--signal);text-decoration:none}
  a:hover{text-decoration:underline}
  .alert{padding:9px 14px;border-bottom:1px solid var(--line);font-size:11px}
  .alert .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .alert .why{color:var(--dim);margin-top:4px}
  .alert .why div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{padding:26px 14px;text-align:center;color:var(--dim);font-size:11px}
  footer{padding:10px 18px;color:var(--dim);font-size:10.5px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>Hermes<span>·</span>Alpha Radar</h1>
  <div class="meta" id="meta"><span class="dot"></span>connecting…</div>
</header>

<main>
  <section>
    <h2>Candidates</h2>
    <div class="filters" id="filters"></div>
    <div id="list"><div class="empty">waiting for the first scan…</div></div>
  </section>
  <section>
    <h2>Alert feed</h2>
    <div id="alerts"><div class="empty">no alerts yet</div></div>
  </section>
</main>

<footer>Score = weighted signals × stealth multiplier × confidence. A candidate is only alpha while the crowd index is still low. Auto-refresh every 10s.</footer>

<script>
const TIERS = ['URGENT','ALPHA','SIGNAL','WATCH','NOISE'];
let minTier = 'WATCH';
let state = null;

const pct = (x) => (x*100).toFixed(0) + '%';
const age = (s) => s<90?Math.round(s)+'s':s<5400?Math.round(s/60)+'m':s<172800?Math.round(s/3600)+'h':Math.round(s/86400)+'d';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short = (a) => a ? a.slice(0,6)+'…'+a.slice(-4) : '';

function renderFilters(){
  document.getElementById('filters').innerHTML = TIERS.map(t =>
    `<button data-tier="${t}" aria-pressed="${t===minTier}">≥ ${t}</button>`).join('');
}

function renderMeta(){
  const behind = state.head != null && state.cursor != null ? state.head - state.cursor : null;
  document.getElementById('meta').innerHTML =
    `<span><span class="dot"></span>${esc(state.chain)}</span>` +
    `<span>block <b>${state.cursor ?? '—'}</b>${behind != null ? ` <span style="opacity:.6">(${behind} behind head)</span>` : ''}</span>` +
    `<span>tracking <b>${state.tracked}</b> collections</span>` +
    `<span>smart wallets <b>${state.walletsTracked}</b></span>` +
    `<span>scans <b>${state.scans}</b></span>`;
}

function renderList(){
  const cut = TIERS.indexOf(minTier);
  const rows = state.collections.filter(c => TIERS.indexOf(c.tier) <= cut);
  const el = document.getElementById('list');
  if (!rows.length){ el.innerHTML = '<div class="empty">nothing at this tier yet</div>'; return; }
  el.innerHTML = rows.map(c => {
    const d = c.d;
    const sigs = c.parts.map(p => {
      const w = p.score == null ? 0 : Math.round(p.score*100);
      return `<div class="sig">
        <span class="lab">${esc(p.label)}</span>
        <span class="bar ${p.score==null?'nd':''}"><i style="width:${w}%"></i></span>
        <span class="note">${p.score==null ? 'no data' : w+'% — '+esc(p.note)}</span>
      </div>`;
    }).join('');
    const blockers = c.blockers.length
      ? `<div class="blockers">DISQUALIFIED — ${c.blockers.map(esc).join(' · ')}</div>` : '';
    const link = state.explorer ? `<a href="${esc(state.explorer)}${c.address}" target="_blank" rel="noopener">explorer ↗</a>` : '';
    return `<details class="row">
      <summary>
        <span class="tier t-${c.tier}">${c.tier}</span>
        <span class="score t-${c.tier}">${c.score}</span>
        <span class="nm">${esc(c.name || short(c.address))}<small>${esc(c.symbol||'')} ${short(c.address)}</small></span>
        <span class="stats">${d.mints} mints · ${d.uniqueMinters} minters · ${d.mintsPerMin.toFixed(1)}/min · crowd ${pct(c.crowdIndex)} · ${age(d.ageSec)}</span>
      </summary>
      <div class="body">
        ${blockers}
        ${sigs}
        <div class="kv">
          <span>holders <b>${d.holders}</b></span>
          <span>secondary <b>${d.secondary}</b></span>
          <span>accel <b>${d.accelRatio.toFixed(2)}×</b></span>
          <span>top10 <b>${pct(d.top10Share)}</b></span>
          <span>bulk <b>${pct(d.bulkShare)}</b></span>
          <span>confidence <b>${pct(c.confidence)}</b></span>
          ${link}
        </div>
      </div>
    </details>`;
  }).join('');
}

function renderAlerts(){
  const el = document.getElementById('alerts');
  if (!state.alerts.length){ el.innerHTML = '<div class="empty">no alerts yet</div>'; return; }
  el.innerHTML = state.alerts.map(a => `<div class="alert">
      <div class="top">
        <span class="t-${a.tier}"><b>${a.tier} ${a.score}</b> ${esc(a.name)}</span>
        <span style="color:var(--dim)">${new Date(a.at).toLocaleTimeString()}</span>
      </div>
      <div class="why">${a.why.map(w => `<div>↳ ${esc(w)}</div>`).join('')}</div>
    </div>`).join('');
}

async function tick(){
  try{
    const r = await fetch('/api/state', {cache:'no-store'});
    state = await r.json();
    renderMeta(); renderList(); renderAlerts();
  }catch(e){
    document.getElementById('meta').innerHTML = '<span style="color:var(--urgent)">agent offline — is `hermes serve` running?</span>';
  }
}

document.getElementById('filters').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if(!b) return;
  minTier = b.dataset.tier; renderFilters(); if(state) renderList();
});

renderFilters(); tick(); setInterval(tick, 10000);
</script>
</body>
</html>
